{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - StyleZone</title>

<link rel="stylesheet" href="{% static 'shop/css/style.css' %}">


</head>

<body>

<header class="navbar">


<div class="logo">
    STYLEZONE
</div>

<nav>

    <a href="{% url 'home' %}">
        Home
    </a>

    <a href="{% url 'product_list' %}">
        Shop
    </a>

    <a href="{% url 'cart' %}">
        Cart
    </a>

    <a href="{% url 'login' %}">
        Login
    </a>

</nav>


</header>

<main class="register-container">

<div class="register-box">

    <h1>Create Account</h1>

    <p class="register-subtitle">
        Join StyleZone and start shopping
    </p>


    {% if error %}

        <p class="register-error">
            {{ error }}
        </p>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <!-- Full Name -->

        <div class="register-field">

            <label for="full_name">
                FULL NAME
            </label>

            <input
                type="text"
                id="full_name"
                name="full_name"
                required
            >

        </div>


        <!-- Email -->

        <div class="register-field">

            <label for="email">
                EMAIL
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

        </div>


        <!-- Phone -->

        <div class="register-field">

            <label for="phone">
                PHONE
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                value="{{ phone }}"
                pattern="[0-9]{10}"
                maxlength="10"
                minlength="10"
                inputmode="numeric"
                required
            >

        </div>


        <!-- Gender -->

        <div class="register-field">

            <label for="gender">
                GENDER
            </label>

            <select
                id="gender"
                name="gender"
                required
            >

                <option value="">
                    Select Gender
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- Password -->

        <div class="register-field">

            <label for="password">
                PASSWORD
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="toggleRegisterPassword()"
                >
                    👁
                </button>

            </div>

        </div>


        <!-- Address -->

        <div class="register-field">

            <label for="address">
                ADDRESS
            </label>

            <textarea
                id="address"
                name="address"
                rows="3"
                required
            ></textarea>

        </div>


        <!-- City -->

        <div class="register-field">

            <label for="city">
                CITY
            </label>

            <input
                type="text"
                id="city"
                name="city"
                required
            >

        </div>


        <!-- Submit -->

        <button
            type="submit"
            class="register-button"
        >
            CREATE ACCOUNT
        </button>

    </form>


    <p class="login-link">

        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>

    </p>

</div>


</main>

<script>

function toggleRegisterPassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

</body>

</html>
