{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - StyleZone</title>

    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">

</head>

<body>

<header class="navbar">

    <div class="logo">
        STYLEZONE
    </div>

    <nav>

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'product_list' %}">
            Shop
        </a>

        <a href="#">
            Cart
        </a>

        <a href="{% url 'login' %}">
            Login
        </a>

    </nav>

</header>


<main class="login-container">

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p class="login-subtitle">
            Login to your StyleZone account
        </p>


        {% if error %}

            <p class="login-error">
                {{ error }}
            </p>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="login-field">

                <label for="email">
                    EMAIL
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </div>


            <div class="login-field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                LOGIN
            </button>

        </form>


        <p class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">
                Register
            </a>
        </p>

    </div>

</main>

</body>
</html>
